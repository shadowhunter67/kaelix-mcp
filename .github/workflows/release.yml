name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      publish_npm:
        description: "Publish to npm using the configured OIDC trusted publisher."
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: npm run test:integration
      - run: npm audit --omit=dev
      - run: npm pack
      - uses: actions/upload-artifact@v7
        with:
          name: npm-package
          path: "*.tgz"
          if-no-files-found: error

  publish-npm:
    runs-on: ubuntu-latest
    needs: verify
    if: github.event_name == 'release' || inputs.publish_npm == 'true'
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install npm with trusted-publishing support
        run: npm install --global npm@11.13.0
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: npm run test:integration
      - run: npm audit --omit=dev
      - name: Verify release tag matches package version
        if: github.event_name == 'release'
        shell: bash
        run: |
          package_version="$(node -p "require('./package.json').version")"
          if [ "${{ github.event.release.tag_name }}" != "v${package_version}" ]; then
            echo "Release tag ${{ github.event.release.tag_name }} does not match package version v${package_version}." >&2
            exit 1
          fi
      - name: Publish to npm
        run: npm publish --provenance --access public
