name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      publish_npm:
        description: "Publish to npm. Requires NPM_TOKEN repository secret."
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: read
  id-token: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: npm run test:integration
      - run: npm audit --omit=dev
      - run: npm pack
      - uses: actions/upload-artifact@v7
        with:
          name: npm-package
          path: "*.tgz"
          if-no-files-found: error

  publish-npm:
    runs-on: ubuntu-latest
    needs: verify
    if: github.event_name == 'release' || inputs.publish_npm == 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: npm run test:integration
      - run: npm audit --omit=dev
      - name: Check npm token
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "NPM_TOKEN repository secret is required to publish." >&2
            exit 1
          fi
      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --provenance --access public
